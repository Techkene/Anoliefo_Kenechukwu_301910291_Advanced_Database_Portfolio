# AquaSense+ Redis configuration (Portfolio 4)
port 6379
bind 127.0.0.1
dir /home/claude/redisdata
# Durability: append-only file, fsync every second (lose at most ~1 s of sensor data on crash)
appendonly yes
appendfsync everysec
# Also take an RDB snapshot every 5 minutes if at least 100 keys changed
save 300 100
# Memory policy: cache keys have TTLs; evict only keys with a TTL when memory is full,
# never the stream or latest-reading hashes
maxmemory 256mb
maxmemory-policy volatile-lru
